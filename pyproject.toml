[project]
name = "policypilotai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "litellm>=1.108.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "streamlit-autorefresh>=1.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
policypilotai = "policypilotai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
